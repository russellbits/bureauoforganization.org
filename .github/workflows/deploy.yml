name: Deploy Bureau of Organization via FTP

on:
  push:
    branches:
      - trunk # Adjust if your primary branch is named master

jobs:
  deploy:
    name: Build and Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Change to 'pnpm' or 'yarn' if applicable

      - name: Install Dependencies
        run: npm ci

      - name: Build Bureau
        run: npm run build

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./build/
          server-dir: /public_html/ # Update to target web root directory (e.g., /public_html/ or /var/www/html/)
          dangerous-clean-slate: false # Set true to wipe target directory prior to sync
