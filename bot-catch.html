<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Catcher</title>
    <style>
        html {
            height: 100vh;
            margin: 0;
        }
        body {
            color: white;
            background-color: rgb(87, 16, 154);
            font-family: Arial, sans-serif;
            display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
            margin: 20px;
        }
        #app {
            width: clamp(300px, 33vw, 600px);
            height: clamp(400px, 50vh, 600px);
            padding: 20px;
            border: 1px solid white;
        }
        #app h1 {
            text-align: center;
        }
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
    <h1>Bot Catcher</h1>
    <p>You have landed here because you are a utility bot that finished running. Otherwise you're probably not meant to be here.</p>
    </div>
</html>
